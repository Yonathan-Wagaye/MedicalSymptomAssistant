services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medical_rag_postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: medical_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/createTables.sql:/docker-entrypoint-initdb.d/01-init.sql

volumes:
  postgres_data: